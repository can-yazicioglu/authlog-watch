[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authlog-watch"
version = "0.1.0"
description = "Detect SSH brute force activity in Linux auth logs from the standard library alone."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Can Yazicioglu" },
]
# Zero runtime dependencies by design. See README "Design notes".
dependencies = []

[project.scripts]
authlog-watch = "authlog_watch.cli:main"

[tool.setuptools]
packages = ["authlog_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
